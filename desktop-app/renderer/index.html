<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام التحكم الكامل - تسجيل الدخول</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">⚡</div>
        <h1>نظام التحكم الكامل</h1>
        <p>مجموعة عبد الفتاح رشيد سليمان</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="apiUrl">عنوان السيرفر</label>
          <input
            type="text"
            id="apiUrl"
            value="http://localhost:3000"
            placeholder="http://localhost:3000"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input
            type="email"
            id="email"
            placeholder="أدخل بريدك الإلكتروني"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input
            type="password"
            id="password"
            placeholder="أدخل كلمة المرور"
            required
            autocomplete="current-password"
          />
        </div>

        <div id="error" class="error" style="display: none"></div>

        <button type="submit" id="loginBtn" class="btn-primary">
          <span id="loginBtnText">تسجيل الدخول</span>
          <span id="loginSpinner" class="spinner" style="display: none"></span>
        </button>
      </form>

      <div class="footer">
        <p>سيعمل التطبيق في الخلفية بعد تسجيل الدخول</p>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
