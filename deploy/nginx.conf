# Nginx configuration for arasgroup.app
# Place this file at: /etc/nginx/sites-available/arasgroup.app
# Then: ln -s /etc/nginx/sites-available/arasgroup.app /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name arasgroup.app www.arasgroup.app;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Main site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arasgroup.app www.arasgroup.app;

    # SSL (issued by Certbot — run after setup)
    ssl_certificate     /etc/letsencrypt/live/arasgroup.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arasgroup.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy       "no-referrer-when-downgrade" always;

    # Logs
    access_log /var/log/nginx/arasgroup.app.access.log;
    error_log  /var/log/nginx/arasgroup.app.error.log;

    # Max upload size (for document attachments)
    client_max_body_size 20M;

    # Static Next.js assets — long-term cache
    location /_next/static/ {
        alias /var/www/arasgroup.app/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Public static files
    location /public/ {
        alias /var/www/arasgroup.app/public/;
        expires 7d;
    }

    # Proxy all other requests to Next.js (port 3001)
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
